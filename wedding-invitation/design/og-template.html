<!DOCTYPE html>
<!-- Source for the link-preview image shown in LINE / Facebook. Render at 1200x630 and save as assets/images/og.jpg
     (any headless Chromium screenshot works; keep the important content away from the outer 60px — some apps crop) -->
<html lang="th">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500&family=Cormorant+Garamond:wght@600&family=Great+Vibes&family=IBM+Plex+Sans+Thai+Looped:wght@300;400;500&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative; display: flex; align-items: center; gap: 70px; padding: 0 70px 0 130px; box-sizing: border-box;
    font-family: 'IBM Plex Sans Thai Looped', sans-serif; color: #7D3818;
    background: radial-gradient(70% 90% at 22% 20%, #FFFFFF 0%, #FBEDE7 45%, #F1D2C8 100%);
  }
  /* faint photo wash on the right, like the opening screen */
  .wash { position: absolute; inset: 0 0 0 46%; background: url(../assets/couple/003.jpg) 50% 25% / cover; mix-blend-mode: luminosity; opacity: .14; filter: blur(2px);
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 35%); mask-image: linear-gradient(90deg, transparent, #000 35%); }
  .frame { position: absolute; inset: 22px; border: 1.5px solid #C9A262; border-radius: 28px; }
  .frame::after { content: ''; position: absolute; inset: 7px; border: 1px solid rgba(201, 162, 98, .45); border-radius: 22px; }
  .dust { position: absolute; inset: 0; background:
    radial-gradient(2px 2px at 8% 20%, #E8C77E, transparent 60%), radial-gradient(1.5px 1.5px at 38% 12%, #F6E3B0, transparent 60%),
    radial-gradient(2.5px 2.5px at 92% 18%, #E8C77E, transparent 60%), radial-gradient(1.5px 1.5px at 58% 88%, #F6E3B0, transparent 60%),
    radial-gradient(2px 2px at 84% 80%, #E8C77E, transparent 60%), radial-gradient(1.5px 1.5px at 12% 86%, #F6E3B0, transparent 60%); }

  /* layered oval portrait — same as the card cover */
  .portrait { position: relative; flex: none; width: 330px; height: 440px; }
  .portrait::before { content: ''; position: absolute; inset: 0; border-radius: 50%; transform: translate(-16px, 16px);
    background: linear-gradient(150deg, #F2D2C8 0%, #F8E3DD 45%, #E8CF95 100%); }
  .portrait img { position: relative; width: 100%; height: 100%; object-fit: cover; object-position: 50% 22%; border-radius: 50%; display: block;
    box-shadow: 0 30px 50px -24px rgba(74, 36, 20, .6); }
  .portrait svg { position: absolute; left: -40px; top: -40px; width: 410px; height: 520px; overflow: visible; }

  .panel { position: relative; flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; }
  .eyebrow { font-family: 'Cinzel', serif; font-weight: 500; font-size: 22px; letter-spacing: .42em; padding-left: .42em; color: #9A7038; }
  .names {
    font-family: 'Great Vibes', cursive; font-size: 98px; line-height: 1.2; padding: 0 14px;
    background: linear-gradient(100deg, #6E2F12 0%, #A8693A 40%, #D9AF6C 52%, #A8693A 64%, #6E2F12 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .names em { font-style: normal; font-size: 66px; color: #BE975E; -webkit-text-fill-color: #BE975E; }
  .nick { margin-top: 2px; font-size: 32px; font-weight: 500; color: #7D3818; }
  .nick i { font-style: normal; color: #C98476; padding: 0 12px; }
  .date { margin-top: 14px; display: flex; align-items: center; gap: 20px; font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 48px; letter-spacing: .18em; color: #7D3818; }
  .date::before, .date::after { content: ''; width: 56px; height: 1.5px; background: #BE975E; }
  .th { font-weight: 400; font-size: 25px; color: #8A6450; }
</style>
</head>
<body>
  <div class="wash"></div>
  <div class="dust"></div>
  <div class="frame"></div>
  <div class="portrait">
    <img src="../assets/couple/002.jpg" alt="">
    <svg viewBox="0 0 410 520" aria-hidden="true">
      <defs>
        <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#8A5A24"/><stop offset=".3" stop-color="#FFF3CC"/><stop offset=".55" stop-color="#C99D55"/><stop offset=".8" stop-color="#FFF6DA"/><stop offset="1" stop-color="#A87838"/>
        </linearGradient>
      </defs>
      <ellipse cx="219" cy="249" rx="165" ry="220" fill="none" stroke="url(#gold)" stroke-width="2.4"/>
      <path fill="url(#gold)" d="M335 70 Q337 84 351 86 Q337 88 335 102 Q333 88 319 86 Q333 84 335 70 Z"/>
      <path fill="url(#gold)" d="M358 52 Q359 57 364 58 Q359 59 358 64 Q357 59 352 58 Q357 57 358 52 Z"/>
      <path fill="url(#gold)" d="M92 418 Q93 427 102 428 Q93 429 92 438 Q91 429 82 428 Q91 427 92 418 Z"/>
    </svg>
  </div>
  <div class="panel">
    <div class="eyebrow">THE WEDDING OF</div>
    <div class="names">Sarinee <em>&amp;</em> Pongsawat</div>
    <div class="nick">ฝน <i>♡</i> โต้ง</div>
    <div class="date">22 · 11 · 2569</div>
    <div class="th">วันอาทิตย์ที่ 22 พฤศจิกายน พ.ศ. 2569 · ร้อยเอ็ด</div>
  </div>
</body>
</html>
